services:
  traefik:
    build:
      context: .
      dockerfile: Dockerfile.traefik
    image: traefik-yaegi-v2:local
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "8000:80"
    working_dir: /
    volumes:
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      # The plugin sources, as a local plugin: ./plugins-local/src/<moduleName>.
      - ..:/plugins-local/src/github.com/juliens/plugin-markdown-demo:ro

  # A plain file server: it knows nothing about Markdown.
  docs:
    image: nginx:1.29-alpine
    volumes:
      - ./docs:/usr/share/nginx/html:ro
